<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户信息 - 学生就业帮助系统</title>
  <script>
    // 路由守卫（同步脚本，先于 DOM 渲染执行）：未登录立即替换为登录页，页面内容不会闪现
    if (!localStorage.getItem("token")) {
      window.location.replace("login.html");
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a class="nav-title" href="index.html">学生就业帮助系统</a>
      <div class="avatar-wrap">
        <div id="avatar" class="avatar" title="账号菜单">?</div>
        <div id="dropdown" class="dropdown">
          <a href="profile.html">用户信息</a>
          <a href="#" id="menu-logout">退出登录</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="page">
    <h2 class="page-title">用户信息</h2>

    <!-- 基本信息：username / id_card 不可修改 -->
    <div class="card panel">
      <h3>基本信息</h3>
      <form id="info-form">
        <div class="field">
          <label for="username">用户名（注册后不可修改）</label>
          <input id="username" type="text" disabled>
        </div>
        <div class="field">
          <label for="id_card">身份证号（不可修改，找回密码凭证）</label>
          <input id="id_card" type="text" disabled>
        </div>
        <div class="field">
          <label for="phone">手机号</label>
          <input id="phone" type="tel" maxlength="11" placeholder="请输入 11 位手机号">
        </div>
        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" type="email" placeholder="请输入邮箱">
        </div>
        <button id="info-submit" type="submit" class="btn">提 交</button>
        <p id="info-msg" class="msg"></p>
      </form>
    </div>

    <!-- 修改密码：独立表单 -->
    <div class="card panel">
      <h3>修改密码</h3>
      <form id="pwd-form">
        <div class="field">
          <label for="old_password">旧密码</label>
          <input id="old_password" type="password" required autocomplete="current-password">
        </div>
        <div class="field">
          <label for="new_password">新密码（至少 6 位）</label>
          <input id="new_password" type="password" minlength="6" required autocomplete="new-password">
        </div>
        <div class="field">
          <label for="new_password2">确认新密码</label>
          <input id="new_password2" type="password" minlength="6" required autocomplete="new-password">
        </div>
        <button id="pwd-submit" type="submit" class="btn">修改密码</button>
        <p id="pwd-msg" class="msg"></p>
      </form>
    </div>
  </main>

  <script type="module" src="js/profile.js"></script>
</body>
</html>
