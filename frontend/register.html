<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 学生就业帮助系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>注册账号</h1>
      <p class="auth-sub">用户名和身份证号注册后不可修改，请谨慎填写</p>

      <form id="register-form">
        <div class="field">
          <label for="username">用户名（3~20 字符）</label>
          <input id="username" type="text" minlength="3" maxlength="20" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">密码（至少 6 位）</label>
          <input id="password" type="password" minlength="6" required autocomplete="new-password">
        </div>
        <div class="field">
          <label for="password2">确认密码</label>
          <input id="password2" type="password" minlength="6" required autocomplete="new-password">
        </div>
        <div class="field">
          <label for="id_card">身份证号（18 位，用于找回密码）</label>
          <input id="id_card" type="text" maxlength="18" required>
        </div>
        <div class="field">
          <label for="phone">手机号（选填）</label>
          <input id="phone" type="tel" maxlength="11" placeholder="可稍后在用户信息页完善">
        </div>
        <div class="field">
          <label for="email">邮箱（选填）</label>
          <input id="email" type="email" placeholder="可稍后在用户信息页完善">
        </div>
        <button type="submit" class="btn">注 册</button>
        <p id="register-msg" class="msg"></p>
      </form>

      <div class="form-links">
        <a href="login.html">已有账号？去登录</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
